name: RDP Access

on:
  workflow_dispatch:

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Windows RDP User
        run: |
          net user ${{ secrets.RDP_USER }} ${{ secrets.RDP_PASS }} /add
          net localgroup administrators ${{ secrets.RDP_USER }} /add
          net accounts /maxpwage:UNLIMITED
        shell: powershell

      - name: Enable Remote Desktop
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        shell: powershell

      - name: Install Ngrok
        run: |
          winget install --id Ngrok.Ngrok -e --accept-package-agreements --accept-source-agreements
        shell: powershell

      - name: Start Ngrok Tunnel for RDP
        run: |
          ngrok config add-authtoken ${{ secrets.NGROK_AUTH_TOKEN }}
          Start-Process ngrok -ArgumentList "tcp 3389"
          Start-Sleep -Seconds 5
        shell: powershell

      - name: Get Ngrok Connection Address
        run: |
          $response = Invoke-RestMethod -Uri "http://localhost:4040/api/tunnels"
          $publicUrl = $response.tunnels[0].public_url
          Write-Host "===================================================="
          Write-Host "YOUR NGROK RDP ADDRESS: $publicUrl"
          Write-Host "Username: ${{ secrets.RDP_USER }}"
          Write-Host "===================================================="
        shell: powershell

      - name: Keep Workflow Alive
        run: |
          $i = 0
          while ($true) {
            Start-Sleep -Seconds 60
            $i++
            Write-Host "Keep-alive tick: $i minutes elapsed"
          }
        shell: powershell
        
