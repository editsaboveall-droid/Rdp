name: RDP Access

on:
  workflow_dispatch:

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Windows RDP User
        run: |
          net user ${{ secrets.RDP_USER }} ${{ secrets.RDP_PASS }} /add
          net localgroup administrators ${{ secrets.RDP_USER }} /add
          net accounts /maxpwage:UNLIMITED
        shell: powershell

      - name: Enable Remote Desktop
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        shell: powershell

      - name: Install and Connect Tailscale
        run: |
          Write-Host "Downloading Tailscale MSI..."
          Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-1.78.3-amd64.msi" -OutFile "tailscale-setup.msi"
          
          Write-Host "Installing Tailscale silently..."
          Start-Process -FilePath "msiexec.exe" -ArgumentList "/i tailscale-setup.msi /quiet /norestart" -NoNewWindow -Wait
          
          Write-Host "Starting Tailscale and logging in..."
          $tailscalePath = "$env:ProgramFiles\Tailscale\tailscale.exe"
          & $tailscalePath up --authkey="${{ secrets.TAILSCALE_AUTH_KEY }}" --accept-routes
        shell: powershell

      - name: Display Connection Information
        run: |
          Write-Host "===================================================="
          Write-Host "RDP is ready!"
          Write-Host "Username: ${{ secrets.RDP_USER }}"
          Write-Host "Connect via your Tailscale IP shown in your Tailscale admin panel."
          Write-Host "===================================================="
        shell: powershell

      - name: Keep Workflow Alive
        run: |
          $i = 0
          while ($true) {
            Start-Sleep -Seconds 60
            $i++
            Write-Host "Keep-alive tick: $i minutes elapsed"
          }
        shell: powershell
        
